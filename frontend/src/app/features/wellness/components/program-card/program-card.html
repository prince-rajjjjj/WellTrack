<div class="card h-100 border-0 shadow-sm program-card">
  <div class="card-body d-flex flex-column p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="program-icon-wrap me-3">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <div class="d-flex align-items-center gap-2">
        @if (issueCount > 0) {
          <button class="badge bg-danger-subtle text-danger px-2 py-1 small border-0"
                  title="View {{ issueCount }} open compliance issue(s)"
                  (click)="issueClick.emit(); $event.stopPropagation()">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ issueCount }} issue{{ issueCount > 1 ? 's' : '' }}
          </button>
        }
        <span class="badge px-2 py-1 small" [ngClass]="statusClass(program.status)">
          <i class="bi me-1 small" [ngClass]="statusIcon(program.status)"></i>
          {{ statusLabel(program.status) }}
        </span>
      </div>
    </div>

    <!-- Title + Description -->
    <h5 class="fw-bold mb-1">{{ program.title }}</h5>
    <p class="text-muted small mb-3 flex-grow-1 description-clamp">{{ program.description }}</p>

    <!-- Dates -->
    <div class="d-flex flex-column gap-1 mb-3">
      <div class="d-flex align-items-center gap-2 text-muted small">
        <i class="bi bi-calendar-event text-primary"></i>
        <span>Start: <strong class="text-dark">{{ program.startDate | date:'mediumDate' }}</strong></span>
      </div>
      <div class="d-flex align-items-center gap-2 text-muted small">
        <i class="bi bi-calendar-check text-danger"></i>
        <span>End: <strong class="text-dark">{{ program.endDate | date:'mediumDate' }}</strong></span>
      </div>
    </div>

    <!-- Admin Actions -->
    @if (isAdmin) {
      <div class="d-flex gap-2 pt-3 border-top mt-auto" (click)="$event.stopPropagation()">
        <button class="btn btn-sm btn-outline-primary flex-fill" (click)="edit.emit(program); $event.stopPropagation()">
          <i class="bi bi-pencil me-1"></i>Edit
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="delete.emit(program); $event.stopPropagation()" title="Delete">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    }

  </div>
</div>

<style>
.program-card { border-radius: 1rem !important; transition: transform 0.15s, box-shadow 0.15s; }
.program-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important; }
.program-icon-wrap {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, #10b981, #059669);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 1.2rem; flex-shrink: 0;
}
.description-clamp {
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
</style>
